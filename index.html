<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>blurpack</title>
    <style>
        /* 1. 스크롤이 가능하도록 설정 */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            background-color: white; /* 배경 이미지 로드 전 대비 */
        }

        body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: white;
        }

        /* 배경 전용 레이어 생성 */
        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
    
            /* 배경 설정 */
            background-image: url('background.webp');
            background-size: 100% 100%;
            background-position: center;
            background-repeat: no-repeat;
            
            /* 가우시안 블러 상시 적용 (수치로 강도 조절) */
            filter: blur(5px); 
    
            /* 블러로 인해 테두리가 하얗게 뜨는 현상 방지 */
            /*transform: scale(1.1); 
    
            /*z-index: -1; /* 글자 뒤로 보냄 */
        }

        /* 중앙 정렬을 위한 컨테이너 */
        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 70vw 0;
            width: 100%;
        }

        .project-link {
            display: block;
            color: #6D3BFF;
            text-decoration: none;
            font-size: 10vw;
            font-weight: 1000;
            margin: 1vh 0; /* 각 항목 간의 간격 */
            cursor: pointer;
            text-align: center;
            will-change: filter; /* 성능 최적화 */
        }
    </style>
</head>
<body>

    <div class="container">
        <a href="./Test1/" class="project-link">Hello</a>
        <a href="./Test2/" class="project-link">My</a>
        <a href="./Test3/" class="project-link">Name</a>
        <a href="./Test4/" class="project-link">IS</a>
        <a href="./Test5/" class="project-link">Ross</a>
        <a href="./Test6/" class="project-link">Nice</a>
        <a href="./Test7/" class="project-link">TO</a>
        <a href="./Test8/" class="project-link">mEEt</a>
        <a href="./Test9/" class="project-link">YOU</a>
        <a href="./Test10/" class="project-link">BLPK</a>
    </div>

    <script>
        const links = document.querySelectorAll('.project-link');

        function updateBlur() {
            const centerY = window.innerHeight / 2;

            links.forEach(link => {
                const rect = link.getBoundingClientRect();
                const linkCenter = rect.top + (rect.height / 2);
                
                // 화면 중앙으로부터의 거리 계산
                const distance = Math.abs(centerY - linkCenter);
                
                // 블러 강도 계산: 중앙에서 멀어질수록 수치 증가 (조절 가능)
                // 150px 이상 멀어지면 블러가 눈에 띄게 시작됨
                const blurValue = Math.max(0, (distance - 100) / 40); 
                
                link.style.filter = `blur(${blurValue}px)`;
                
                // 투명도 조절 (선택 사항: 중앙이 아닐수록 흐릿해짐)
                // const opacityValue = Math.max(0.2, 1 - (distance / (window.innerHeight / 1.5)));
                // link.style.opacity = opacityValue;
            });
        }

        // 스크롤 시 실시간 실행
        window.addEventListener('scroll', updateBlur);
        // 화면 크기 변경 시 대응
        window.addEventListener('resize', updateBlur);
        // 초기 로드 시 실행
        updateBlur();
    </script>

</body>
</html>
