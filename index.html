<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>index</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    width:100vw;
    height:100vh;
    overflow:hidden;

    background:#6d3bff;
    color:white;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        sans-serif;

    display:flex;
    justify-content:center;
    align-items:center;
}

.container{
    width:100%;
    max-width:500px;
    height:100vh;

    overflow-y:auto;

    display:flex;
    justify-content:center;
    align-items:center;

    padding:40px 24px;
}

.menu{
    width:100%;
    text-align:center;
}

.menu a{
    display:block;

    color:white;
    text-decoration:none;

    font-size:2rem;
    font-weight:700;

    line-height:1.2;
    margin:1.5rem 0;

    transition:opacity .2s ease;
}

.menu a:hover,
.menu a:active{
    opacity:0.7;
}
</style>
</head>

<body>

<div class="container">

    <nav class="menu">
        <a href="./timetable">timetable</a>
        <a href="./set-table">set table</a>
        <a href="./bias-analyzer">bias analyzer</a>
    </nav>

</div>

</body>
</html>
