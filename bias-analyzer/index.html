<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>미디어 바이어스 분석기 (News Bias Analyzer)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#6d3bff',
                        'primary-dark': '#552ec7',
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col justify-between font-sans">

    <header class="bg-white border-b border-slate-200 sticky top-0 z-10 shadow-sm">
        <div class="max-w-5xl mx-auto px-4 py-4 flex flex-col sm:flex-row justify-between items-center gap-4">
            <h1 class="text-xl font-bold text-primary flex items-center gap-2">
                <i class="fa-solid fa-newspaper"></i> 미디어 바이어스 분석기
            </h1>
            <div class="flex items-center gap-2 w-full sm:w-auto">
                <input type="password" id="apiKey" placeholder="OpenAI API Key 입력 (sk-...)" 
                    class="w-full sm:w-64 px-3 py-1.5 text-sm border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary/50">
            </div>
        </div>
    </header>

    <main class="max-w-5xl mx-auto px-4 py-8 flex-grow w-full grid grid-cols-1 md:grid-cols-2 gap-8">
        
        <div class="flex flex-col gap-4">
            <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm flex flex-col flex-grow">
                <label for="newsArticle" class="text-sm font-semibold text-slate-700 mb-2 flex items-center gap-2">
                    <i class="fa-solid fa-feather-pointed text-primary"></i> 분석할 뉴스 기사 본문
                </label>
                <textarea id="newsArticle" placeholder="이곳에 뉴스 기사 전문을 입력하세요..." 
                    class="w-full flex-grow min-h-[350px] p-4 border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-primary/50 resize-none text-sm leading-relaxed mb-4"></textarea>
                
                <button id="analyzeBtn" onclick="analyzeNews()"
                    class="w-full bg-primary hover:bg-primary-dark text-white font-semibold py-3.5 px-4 rounded-xl transition duration-200 flex items-center justify-center gap-2 shadow-md shadow-primary/20">
                    <i class="fa-solid fa-magnifying-glass-chart"></i> 기사 분석 시작하기
                </button>
            </div>
        </div>

        <div class="flex flex-col gap-4">
            <div id="loading" class="hidden bg-white p-12 rounded-2xl border border-slate-200 shadow-sm text-center flex-grow flex flex-col items-center justify-center gap-4">
                <div class="animate-spin rounded-full h-12 w-12 border-4 border-primary border-t-transparent"></div>
                <p class="text-slate-600 font-medium animate-pulse">AI가 기사를 엄밀하게 분석하고 있습니다...</p>
            </div>

            <div id="placeholder" class="bg-white p-12 rounded-2xl border border-slate-200 shadow-sm text-center flex-grow flex flex-col items-center justify-center gap-3 text-slate-400">
                <i class="fa-solid fa-chart-pie text-5xl mb-2 text-slate-300"></i>
                <p class="font-medium">좌측에 기사를 입력하고 분석을 진행해 주세요.</p>
                <p class="text-xs">입력하신 API Key는 브라우저 내부에서만 안전하게 사용됩니다.</p>
            </div>

            <div id="resultContainer" class="hidden flex flex-col gap-6 flex-grow">
                
                <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm">
                    <h3 class="text-xs font-bold uppercase tracking-wider text-slate-400 mb-3">정치 성향 판정</h3>
                    <div class="flex items-center justify-between">
                        <div>
                            <span id="biasLabel" class="text-2xl font-black px-3 py-1 rounded-lg text-white">중립</span>
                            <p class="text-xs text-slate-500 mt-2">1점(극좌) ~ 5.5점(중립) ~ 10점(극우)</p>
                        </div>
                        <div class="text-right">
                            <span id="biasScore" class="text-4xl font-extrabold text-primary">5.5</span>
                            <span class="text-slate-400 font-bold">/ 10</span>
                        </div>
                    </div>
                    <div class="w-full bg-slate-100 h-3 rounded-full mt-4 overflow-hidden relative">
                        <div id="scoreMarker" class="bg-primary h-full rounded-full transition-all duration-500" style="width: 55%;"></div>
                    </div>
                </div>

                <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm flex-grow flex flex-col gap-6">
                    <h3 class="text-sm font-bold text-slate-800 border-b pb-2 flex items-center gap-2">
                        <i class="fa-solid fa-list-check text-primary"></i> 세부 분석 항목
                    </h3>

                    <div>
                        <h4 class="text-sm font-bold text-slate-700 flex items-center gap-1.5">
                            <span class="w-2 h-2 rounded-full bg-primary"></span> 1. 프레이밍 (Framing)
                        </h4>
                        <div id="framingResult" class="mt-2 text-sm text-slate-600 bg-slate-50 p-3 rounded-xl border border-slate-100 whitespace-pre-line"></div>
                    </div>

                    <div>
                        <h4 class="text-sm font-bold text-slate-700 flex items-center gap-1.5">
                            <span class="w-2 h-2 rounded-full bg-primary"></span> 2. 감정적 언어
                        </h4>
                        <div id="emotionalResult" class="mt-2 text-sm text-slate-600 bg-slate-50 p-3 rounded-xl border border-slate-100 whitespace-pre-line"></div>
                    </div>

                    <div>
                        <h4 class="text-sm font-bold text-slate-700 flex items-center gap-1.5">
                            <span class="w-2 h-2 rounded-full bg-primary"></span> 3. 통계 및 권위 오용
                        </h4>
                        <div id="statsResult" class="mt-2 text-sm text-slate-600 bg-slate-50 p-3 rounded-xl border border-slate-100 whitespace-pre-line"></div>
                    </div>
                </div>

            </div>
        </div>
    </main>

    <footer class="bg-white border-t border-slate-200 py-4 text-center text-xs text-slate-400">
        <p>&copy; 2026 Media Bias Analyzer. Built with OpenAI API.</p>
    </footer>

    <script>
        // 로컬스토리지에서 이전에 입력한 API Key 불러오기
        document.getElementById('apiKey').value = localStorage.getItem('news_analyzer_api_key') || '';

        async function analyzeNews() {
            const apiKey = document.getElementById('apiKey').value.trim();
            const article = document.getElementById('newsArticle').value.trim();

            if (!apiKey) {
                alert('OpenAI API Key를 입력해주세요.');
                return;
            }
            if (!article) {
                alert('분석할 뉴스 기사 본문을 입력해주세요.');
                return;
            }

            // API Key 로컬스토리지 저장
            localStorage.setItem('news_analyzer_api_key', apiKey);

            // UI 상태 전환
            document.getElementById('placeholder').classList.add('hidden');
            document.getElementById('resultContainer').classList.add('hidden');
            document.getElementById('loading').classList.remove('hidden');

            // LLM용 엄격한 시스템 프롬프트 정의
            const systemPrompt = `당신은 뉴스 기사의 편향성과 왜곡을 객관적으로 검증하는 정밀 분석 인공지능입니다.
다음 규칙을 절대적으로 준수하여 입력된 기사를 분석하고 JSON 형식으로만 응답하세요.

[규칙]
1. 기사에 없는 내용은 절대 추측하거나 유추하여 확장하지 마십시오.
2. 분석 근거를 제시할 때는 반드시 기사에 나오는 실제 문장을 정확히 인용(quote)하여 명시하십시오.
3. 해당 항목에 대한 명확한 근거가 발견되지 않으면 무조건 "발견되지 않음"이라고 기술하십시오.
4. 정치 성향은 오직 [좌성향, 우성향, 중립] 중 하나로만 판단하며, 점수는 1점(극좌)부터 10점(극우)까지의 실수(예: 4.5, 7.0)로 평가합니다. (중립은 5.5점 부근)

[출력 JSON 포맷]
{
  "biasLabel": "좌성향 또는 우성향 또는 중립",
  "biasScore": 5.5,
  "framing": "분석 내용 기재 (인용구 포함) 또는 '발견되지 않음'",
  "emotionalLanguage": "분석 내용 기재 (인용구 포함) 또는 '발견되지 않음'",
  "misuse": "분석 내용 기재 (인용구 포함) 또는 '발견되지 않음'"
}`;

            try {
                const response = await fetch('https://api.openai.com/v1/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${apiKey}`
                    },
                    body: JSON.stringify({
                        model: 'gpt-4o-mini', // 가성비와 성능이 좋은 모델 선택
                        response_format: { type: "json_object" },
                        messages: [
                            { role: 'system', content: systemPrompt },
                            { role: 'user', content: `다음 기사를 규칙에 맞게 분석해주세요:\n\n${article}` }
                        ],
                        temperature: 0.1 // 일관성과 객관성을 위해 온도를 낮춤
                    })
                });

                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.error?.message || 'API 요청 실패');
                }

                const data = await response.json();
                const result = JSON.parse(data.choices[0].messages ? data.choices[0].message.content : data.choices[0].message.content);

                // UI에 데이터 매핑
                renderResults(result);

            } catch (error) {
                alert('에러가 발생했습니다: ' + error.message);
                document.getElementById('placeholder').classList.remove('hidden');
            } finally {
                document.getElementById('loading').classList.add('hidden');
            }
        }

        function renderResults(data) {
            // 성향 라벨 색상 처리
            const labelEl = document.getElementById('biasLabel');
            labelEl.innerText = data.biasLabel;
            
            if (data.biasLabel.includes('좌')) {
                labelEl.className = "text-2xl font-black px-3 py-1 rounded-lg text-white bg-blue-600";
            } else if (data.biasLabel.includes('우')) {
                labelEl.className = "text-2xl font-black px-3 py-1 rounded-lg text-white bg-red-600";
            } else {
                labelEl.className = "text-2xl font-black px-3 py-1 rounded-lg text-white bg-slate-500";
            }

            // 점수 바 세팅
            const score = parseFloat(data.biasScore) || 5.5;
            document.getElementById('biasScore').innerText = score.toFixed(1);
            
            // 1~10점을 0%~100% 게이지로 변환
            const percentage = ((score - 1) / 9) * 100;
            document.getElementById('scoreMarker').style.width = `${percentage}%`;

            // 세부 텍스트 세팅
            document.getElementById('framingResult').innerText = data.framing;
            document.getElementById('emotionalResult').innerText = data.emotionalLanguage;
            document.getElementById('statsResult').innerText = data.misuse;

            // 결과창 표시
            document.getElementById('resultContainer').classList.remove('hidden');
        }
    </script>
</body>
</html>
